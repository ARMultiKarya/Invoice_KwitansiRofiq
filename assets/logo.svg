<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient for Chevron -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Blue Gradient for Hands -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Top Chevron Wings (V Emblem) -->
  <path d="M 90,85 L 150,30 L 210,85 L 185,85 L 150,52 L 115,85 Z" fill="url(#goldGrad)" />
  <path d="M 110,110 L 150,75 L 190,110 L 172,110 L 150,90 L 128,110 Z" fill="url(#goldGrad)" opacity="0.85" />

  <!-- Left Hand -->
  <path d="M 75,200 C 60,170 50,130 90,105 C 105,95 120,110 115,125 C 108,145 92,165 95,185 C 98,198 120,200 135,185 C 142,178 145,160 148,140 C 150,135 156,135 158,140 C 155,165 150,195 138,212 C 125,230 90,230 75,200 Z" fill="url(#blueGrad)" />

  <!-- Right Hand -->
  <path d="M 225,200 C 240,170 250,130 210,105 C 195,95 180,110 185,125 C 192,145 208,165 205,185 C 202,198 180,200 165,185 C 158,178 155,160 152,140 C 150,135 144,135 142,140 C 145,165 150,195 162,212 C 175,230 210,230 225,200 Z" fill="url(#blueGrad)" />

  <!-- Wrist Connection / Base Accent -->
  <path d="M 120,220 Q 150,235 180,220 Q 150,245 120,220 Z" fill="url(#blueGrad)" opacity="0.9" />
</svg>
