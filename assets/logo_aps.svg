<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2a4a" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
  </defs>

  <!-- Outer Double Circle Path -->
  <circle cx="150" cy="150" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="150" cy="150" r="126" fill="none" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Circular Text Path for ALAT TULIS KANTOR -->
  <path id="textArcTop" d="M 30,150 A 120,120 0 1,1 270,150" fill="none" />
  <path id="textArcBottom" d="M 270,150 A 120,120 0 1,1 30,150" fill="none" />

  <text font-family="'Times New Roman', serif" font-weight="bold" font-size="19" fill="#aa771c" letter-spacing="3">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      ALAT TULIS KANTOR
    </textPath>
  </text>

  <text font-family="'Times New Roman', serif" font-weight="bold" font-size="16" fill="#aa771c" letter-spacing="3">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      CV ARTHA PENA SEJAHTERA
    </textPath>
  </text>

  <!-- Decorative Stars on Sides -->
  <g fill="url(#goldGrad)">
    <!-- Left Star -->
    <polygon points="38,150 42,143 49,143 43,148 45,155 40,151 34,155 36,148 31,143 38,143" transform="rotate(-15 38 150)" />
    <!-- Right Star -->
    <polygon points="262,150 266,143 273,143 267,148 269,155 264,151 258,155 260,148 255,143 262,143" transform="rotate(15 262 150)" />
  </g>

  <!-- Center Shield Badge Frame -->
  <g transform="translate(150, 150)">
    <!-- Inner Octagonal / Shield Outline -->
    <polygon points="0,-75 55,-55 65,15 0,75 -65,15 -55,-55" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
    <polygon points="0,-68 48,-50 57,12 0,67 -57,12 -48,-50" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 2" />

    <!-- Crown at Top of Shield -->
    <path d="M -22,-38 L -30,-54 L -12,-46 L 0,-60 L 12,-46 L 30,-54 L 22,-38 Z" fill="url(#goldGrad)" />
    <circle cx="-30" cy="-56" r="3" fill="url(#goldGrad)" />
    <circle cx="0" cy="-62" r="3.5" fill="url(#goldGrad)" />
    <circle cx="30" cy="-56" r="3" fill="url(#goldGrad)" />

    <!-- Fountain Pen Nib Symbol -->
    <!-- Nib Body -->
    <path d="M 0,-30 L 22,10 L 15,38 L 0,46 L -15,38 L -22,10 Z" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <!-- Nib Center Line and Breather Hole -->
    <line x1="0" y1="-30" x2="0" y2="15" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="0" cy="0" r="5" fill="url(#goldGrad)" />
    <!-- Nib Tip Accent -->
    <polygon points="0,-30 -8,-15 8,-15" fill="url(#goldGrad)" />
  </g>
</svg>
