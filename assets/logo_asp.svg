<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="100%" height="100%">
  <defs>
    <linearGradient id="aspGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4500" />
      <stop offset="50%" stop-color="#cc0000" />
      <stop offset="100%" stop-color="#800000" />
    </linearGradient>
    <linearGradient id="aspOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c00" />
      <stop offset="100%" stop-color="#ff4500" />
    </linearGradient>
  </defs>

  <!-- Outer Yellow Box with Red Border -->
  <rect x="10" y="10" width="280" height="300" rx="12" fill="#fed7aa" stroke="#990000" stroke-width="12" />

  <!-- Monogram A Shape -->
  <path d="M 150,55 L 70,220 L 115,220 L 140,165 L 175,165 L 150,115 L 142,130 L 130,150 L 150,110 Z" fill="url(#aspGrad)" />
  <path d="M 60,225 L 150,45 L 210,170 L 180,170 L 150,90 L 105,225 Z" fill="url(#aspGrad)" />

  <!-- Monogram P Flame Loop -->
  <path d="M 135,145 Q 240,110 240,175 Q 240,225 155,225 L 155,195 Q 205,195 205,170 Q 205,145 150,165 Z" fill="url(#aspGrad)" />

  <!-- Flame Accent Swirl Top -->
  <path d="M 80,105 C 100,75 145,75 180,95 C 150,85 110,95 95,115 Z" fill="url(#aspOrange)" />

  <!-- Bottom Company Banner Text -->
  <rect x="20" y="240" width="260" height="55" fill="#990000" rx="4" />
  <text x="150" y="263" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">CV ANDALAN</text>
  <text x="150" y="285" font-family="'Inter', sans-serif" font-weight="900" font-size="18" fill="#ffedd5" text-anchor="middle">SOLUSI PRIMA</text>
</svg>
