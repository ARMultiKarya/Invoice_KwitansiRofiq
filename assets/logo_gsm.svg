<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- Left Emblem Logo -->
  <g transform="translate(10, 10)">
    <!-- Outer Red Wings / Frame -->
    <path d="M 15,90 L 45,35 L 75,15 L 105,35 L 135,90 L 105,145 L 75,165 L 45,145 Z" fill="none" stroke="url(#redGrad)" stroke-width="8" />
    <path d="M 0,90 L 30,25 L 75,0 L 120,25 L 150,90 L 120,155 L 75,180 L 30,155 Z" fill="none" stroke="url(#redGrad)" stroke-width="5" opacity="0.7" />

    <!-- Inner Red Hexagon Shield Background -->
    <polygon points="75,22 125,50 125,130 75,158 25,130 25,50" fill="url(#redGrad)" />

    <!-- Eagle Head Silhouette in White -->
    <path d="M 75,35 C 85,35 98,42 102,52 C 95,54 88,52 82,48 C 92,58 95,70 85,82 C 78,90 65,85 58,80 C 65,80 72,78 75,72 C 68,75 58,72 52,65 C 60,65 68,62 70,55 C 62,58 55,55 50,48 C 60,45 68,40 75,35 Z" fill="#ffffff" />
    <!-- Eagle Eye -->
    <circle cx="82" cy="45" r="3" fill="#b91c1c" />

    <!-- 5 White Stars underneath eagle -->
    <g fill="#ffffff" transform="translate(42, 105)">
      <!-- Star 1 -->
      <polygon points="6,0 8,4 12,4 9,7 10,11 6,9 2,11 3,7 0,4 4,4" />
      <!-- Star 2 -->
      <polygon points="21,0 23,4 27,4 24,7 25,11 21,9 17,11 18,7 15,4 19,4" />
      <!-- Star 3 (Center Larger) -->
      <polygon points="36,-2 39,3 44,3 40,7 42,12 36,9 30,12 32,7 28,3 33,3" />
      <!-- Star 4 -->
      <polygon points="51,0 53,4 57,4 54,7 55,11 51,9 47,11 48,7 45,4 49,4" />
      <!-- Star 5 -->
      <polygon points="66,0 68,4 72,4 69,7 70,11 66,9 62,11 63,7 60,4 64,4" />
    </g>

    <!-- Lower Banner on Emblem -->
    <rect x="25" y="125" width="100" height="18" fill="#1f2937" rx="3" />
    <text x="75" y="138" font-family="sans-serif" font-weight="900" font-size="9" fill="#ffffff" text-anchor="middle" letter-spacing="1">GARUDA</text>
  </g>

  <!-- Right Typography Text -->
  <g transform="translate(175, 45)">
    <!-- Subtitle CV -->
    <text x="0" y="22" font-family="'Arial Black', sans-serif" font-weight="900" font-size="26" fill="#1f2937" font-style="italic">CV</text>
    <!-- Main Title GARUDA -->
    <text x="0" y="65" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#b91c1c" letter-spacing="2" font-style="italic">GARUDA</text>
    
    <!-- Flanking Subtitle SAFETY MANDIRI -->
    <line x1="0" y1="82" x2="45" y2="82" stroke="#b91c1c" stroke-width="3" />
    <text x="55" y="87" font-family="sans-serif" font-weight="900" font-size="16" fill="#1f2937" letter-spacing="3">SAFETY MANDIRI</text>
    <line x1="245" y1="82" x2="290" y2="82" stroke="#b91c1c" stroke-width="3" />
  </g>
</svg>
